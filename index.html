<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Súper Calculadora Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Súper Calculadora Pro</h1>
      <button id="cfgBtn" class="zoom" type="button">Ajustes</button>
    </header>
    <nav id="nav" aria-label="Módulos"></nav>
    <section class="panel">
      <h2 id="title"></h2>
      <div id="modes" class="modes"></div>
      <form id="form" autocomplete="off"></form>
      <div id="figwrap" class="figwrap" hidden>
        <div id="fig" class="fig"></div>
        <button id="zoom" class="zoom" type="button" aria-label="Ampliar dibujo">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          <span>Ampliar</span>
        </button>
      </div>
      <dl id="out" aria-live="polite"></dl>
      <div class="acts">
        <button id="copy" type="button">Copiar resultados</button>
        <button id="clear" type="button">Limpiar datos</button>
      </div>
    </section>
  </main>

  <dialog id="dlg" aria-label="Dibujo ampliado">
    <button id="close" class="zoom" type="button">Cerrar</button>
    <div id="big" class="big"></div>
  </dialog>

  <dialog id="cfg" aria-label="Ajustes">
    <div class="card">
      <h2>Ajustes</h2>
      <label>Decimales
        <select id="cDec"><option value="auto">Automático</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select>
      </label>
      <label>Valor de π
        <select id="cPi"><option value="exact">Exacto (3.14159265…)</option><option value="3.14">3.14</option><option value="3.1416">3.1416</option><option value="22/7">22/7</option></select>
      </label>
      <label>Paso de los botones − y +
        <select id="cStep"><option>0.01</option><option>0.1</option><option>1</option><option>10</option></select>
      </label>
      <div class="acts"><button id="cReset" type="button">Restablecer</button><button id="cClose" type="button">Listo</button></div>
    </div>
  </dialog>

  <script src="dibujos.js"></script>
  <script src="script.js"></script>
</body>
</html>
